<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- After: Tracé vectoriel SVG HD fluide et lissé -->
  <g transform="translate(40, 40)">
    <rect x="20" y="20" width="280" height="280" rx="30" fill="#1C1917" stroke="#F7941D" stroke-width="2"/>
    <!-- Forme vectorielle lissée parfaite avec courbes de Bézier -->
    <path d="M 60 70 C 80 120, 120 180, 160 210 C 200 180, 240 120, 260 70 L 230 70 C 210 110, 180 160, 160 180 C 140 160, 110 110, 90 70 Z" 
          fill="#F7941D" 
          filter="drop-shadow(0 4px 12px rgba(247,148,29,0.3))"/>
    <polygon points="160,80 180,120 140,120" fill="#FFFFFF"/>
    <!-- Typographie vectorielle nette -->
    <text x="160" y="248" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">VECTOR HD</text>
    <text x="160" y="270" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#F7941D" text-anchor="middle" letter-spacing="2">300 DPI • SVG EXPORT</text>
  </g>
</svg>
