<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Before: Logo matriciel pixelisé basse résolution (simulation pixel art / bruit) -->
  <g transform="translate(40, 40)">
    <rect x="20" y="20" width="280" height="280" rx="30" fill="#1C1917"/>
    <!-- Forme centrale stylisée VX pixelisée avec petits carrés -->
    <g fill="#F97316" opacity="0.9">
      <!-- V pixelisé -->
      <rect x="60" y="60" width="20" height="20"/>
      <rect x="75" y="80" width="20" height="20"/>
      <rect x="90" y="100" width="20" height="20"/>
      <rect x="105" y="120" width="20" height="20"/>
      <rect x="120" y="140" width="20" height="20"/>
      <rect x="135" y="160" width="20" height="20"/>
      <rect x="150" y="180" width="20" height="20"/>
      <rect x="165" y="160" width="20" height="20"/>
      <rect x="180" y="140" width="20" height="20"/>
      <rect x="195" y="120" width="20" height="20"/>
      <rect x="210" y="100" width="20" height="20"/>
      <rect x="225" y="80" width="20" height="20"/>
      <rect x="240" y="60" width="20" height="20"/>
      <!-- Bruit et bavures simulant mauvaise compression -->
      <rect x="50" y="70" width="10" height="10" fill="#FB923C" opacity="0.5"/>
      <rect x="80" y="60" width="12" height="12" fill="#7C2D12" opacity="0.6"/>
      <rect x="230" y="70" width="10" height="10" fill="#FB923C" opacity="0.5"/>
      <rect x="145" y="200" width="15" height="15" fill="#C2410C" opacity="0.7"/>
    </g>
    <!-- Texte flou pixelisé -->
    <rect x="80" y="230" width="160" height="18" fill="#78716C" opacity="0.8" rx="4"/>
    <rect x="110" y="255" width="100" height="10" fill="#57534E" opacity="0.6" rx="2"/>
  </g>
</svg>
