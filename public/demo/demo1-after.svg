<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- After: Fond transparent 100% avec bordures nettes détourées -->
  <g transform="translate(50, 40)">
    <!-- Contour anti-halo subtil pour impression textile DTF -->
    <circle cx="150" cy="140" r="102" fill="none" stroke="#F7941D" stroke-width="3"/>
    <circle cx="150" cy="140" r="100" fill="#18181B" stroke="#000000" stroke-width="4"/>
    <path d="M90 90 L130 130 L100 150 Z" fill="#F97316"/>
    <path d="M210 90 L170 130 L200 150 Z" fill="#F97316"/>
    <polygon points="150,110 120,170 180,170" fill="#FFFFFF"/>
    <polygon points="150,140 135,170 165,170" fill="#000000"/>
    <!-- Yeux éclatants -->
    <ellipse cx="120" cy="130" rx="12" ry="8" fill="#FACC15"/>
    <ellipse cx="180" cy="130" rx="12" ry="8" fill="#FACC15"/>
    <circle cx="120" cy="130" r="4" fill="#000000"/>
    <circle cx="180" cy="130" r="4" fill="#000000"/>
    <!-- Moustaches et crocs -->
    <path d="M130 180 L150 200 L170 180 Z" fill="#FFFFFF"/>
    <path d="M70 160 L110 165 M70 175 L110 175 M70 190 L110 185" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M230 160 L190 165 M230 175 L190 175 M230 190 L190 185" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Typo nette avec liseré contrasté -->
    <text x="150" y="275" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">FAIRYTALE REBEL</text>
    <text x="150" y="295" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#F7941D" text-anchor="middle" letter-spacing="1">DTF PRINT READY</text>
  </g>
</svg>
