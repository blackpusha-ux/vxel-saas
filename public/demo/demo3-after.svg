    <circle cx="115" cy="200" r="14" fill="#0284C7"/>
    <circle cx="185" cy="200" r="14" fill="#0284C7"/>
    <text x="150" y="272" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#38BDF8" text-anchor="middle" letter-spacing="2">4X ULTRA-HD • 300 DPI</text>
  </g>
