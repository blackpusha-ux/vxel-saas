<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- After: Visuel Ultra-HD 4x 300 DPI optimisé pour DTF -->
  <g transform="translate(50, 50)">
    <circle cx="150" cy="150" r="120" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Étoiles nettes en arrière plan -->
    <polygon points="60,60 63,68 71,68 65,73 67,81 60,76 53,81 55,73 49,68 57,68" fill="#FACC15"/>
    <polygon points="240,80 242,86 248,86 243,90 245,96 240,92 235,96 237,90 232,86 238,86" fill="#FACC15"/>
    <!-- Mascotte astronaute nette -->
    <circle cx="150" cy="130" r="50" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
    <ellipse cx="150" cy="130" rx="35" ry="25" fill="#0284C7"/>
    <path d="M125 120 Q140 115 155 120" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <rect x="120" y="180" width="60" height="65" rx="15" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
    <rect x="135" y="195" width="30" height="25" rx="6" fill="#F7941D"/>
